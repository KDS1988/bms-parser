<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0c0f">
<title>BMS Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c0f;
    --panel: #14181d;
    --panel-line: #262c34;
    --text: #e8ecf1;
    --text-dim: #7a8493;
    --tally-off: #2a3038;
    --tally-ready: #2ecc71;
    --tally-live: #ff3b3b;
    --tally-glow: rgba(255, 59, 59, 0.45);
    --error: #ff6b6b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 50% 0%, rgba(255,255,255,0.04), transparent 60%);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 60px;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 8px;
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 4px 0 32px;
    letter-spacing: -0.01em;
  }

  .tally-wrap {
    position: relative;
    width: 168px;
    height: 168px;
    margin-bottom: 20px;
  }

  .tally-glow {
    position: absolute;
    inset: -24px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--tally-glow), transparent 70%);
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }
  .tally-glow.on { opacity: 1; animation: pulse 1.6s ease-in-out infinite; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.55; }
    50% { transform: scale(1.12); opacity: 1; }
  }

  button.tally {
    width: 168px;
    height: 168px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #1c2128, #0f1216 70%);
    box-shadow:
      inset 0 0 0 3px var(--panel-line),
      inset 0 6px 18px rgba(0,0,0,0.6),
      0 8px 30px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, box-shadow 0.3s ease;
    position: relative;
  }
  button.tally:active { transform: scale(0.97); }
  button.tally:disabled { cursor: not-allowed; }

  button.tally .lamp {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: var(--tally-off);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }
  button.tally .lamp svg { width: 34px; height: 34px; }

  button.tally.state-ready .lamp {
    background: var(--tally-ready);
    box-shadow: 0 0 24px rgba(46, 204, 113, 0.5);
  }
  button.tally.state-running .lamp {
    background: var(--tally-live);
    box-shadow: 0 0 30px var(--tally-glow);
    animation: pulse-lamp 1s ease-in-out infinite;
  }
  button.tally.state-error .lamp {
    background: var(--error);
    box-shadow: 0 0 24px rgba(255, 107, 107, 0.5);
  }

  @keyframes pulse-lamp {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.65; }
  }

  .status-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .status-detail {
    font-size: 14px;
    color: var(--text);
    min-height: 20px;
    text-align: center;
    max-width: 320px;
    margin-bottom: 36px;
  }

  .stats {
    display: flex;
    gap: 12px;
    width: 100%;
    max-width: 360px;
    margin-bottom: 24px;
  }
  .stat {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 10px;
    padding: 14px 10px;
    text-align: center;
  }
  .stat .n {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    font-weight: 600;
  }
  .stat.ok .n { color: var(--tally-ready); }
  .stat.err .n { color: var(--error); }
  .stat .label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .panel {
    width: 100%;
    max-width: 360px;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 10px;
    overflow: hidden;
  }
  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--panel-line);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .panel-head button {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
  }
  .panel-head button:hover { color: var(--text); }

  .log {
    max-height: 260px;
    overflow-y: auto;
  }
  .log-empty {
    padding: 24px 16px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
  }
  .log-row {
    display: flex;
    gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--panel-line);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
  }
  .log-row:last-child { border-bottom: none; }
  .log-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    margin-top: 5px;
    flex-shrink: 0;
  }
  .log-dot.ok { background: var(--tally-ready); }
  .log-dot.err { background: var(--error); }
  .log-time { color: var(--text-dim); flex-shrink: 0; }
  .log-msg { color: var(--text); word-break: break-word; }
</style>
</head>
<body>

  <div class="eyebrow">Отдел назначений · vSporte</div>
  <h1>BMS Runner</h1>

  <div class="tally-wrap">
    <div class="tally-glow" id="glow"></div>
    <button class="tally state-ready" id="tallyBtn">
      <span class="lamp">
        <svg id="lampIcon" viewBox="0 0 24 24" fill="none" stroke="#0a0c0f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
      </span>
    </button>
  </div>

  <div class="status-label" id="statusLabel">Готов к запуску</div>
  <div class="status-detail" id="statusDetail">Обновит доску по текущим данным BMS</div>

  <div class="stats">
    <div class="stat ok"><div class="n" id="okCount">0</div><div class="label">успешных</div></div>
    <div class="stat err"><div class="n" id="errCount">0</div><div class="label">ошибок</div></div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <span>История</span>
      <button id="clearBtn">Очистить</button>
    </div>
    <div class="log" id="log">
      <div class="log-empty">Здесь появится история запусков</div>
    </div>
  </div>

<script>
  // ── НАСТРОЙКИ ── впиши после деплоя Cloudflare Worker (см. README проекта)
  const WORKER_URL = 'https://bms-parser.dmitry-korneev88.workers.dev/';
  const RUNNER_SECRET = '65d5a39a8f3d0ff5c36e2dc61dcd5a6f60d07fa080c52990b8d99e2c4b6ada61';

  const STORAGE_KEY = 'bms_runner_history_v1';
  const MAX_HISTORY = 30;

  const btn = document.getElementById('tallyBtn');
  const glow = document.getElementById('glow');
  const statusLabel = document.getElementById('statusLabel');
  const statusDetail = document.getElementById('statusDetail');
  const logEl = document.getElementById('log');
  const okCountEl = document.getElementById('okCount');
  const errCountEl = document.getElementById('errCount');
  const lampIcon = document.getElementById('lampIcon');

  const ICON_PLAY = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
  const ICON_CHECK = '<polyline points="20 6 9 17 4 12"></polyline>';
  const ICON_ERROR = '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>';

  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch (e) { return []; }
  }
  function saveHistory(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list.slice(0, MAX_HISTORY)));
  }

  function renderHistory() {
    const list = loadHistory();
    const ok = list.filter(x => x.ok).length;
    const err = list.filter(x => !x.ok).length;
    okCountEl.textContent = ok;
    errCountEl.textContent = err;

    if (list.length === 0) {
      logEl.innerHTML = '<div class="log-empty">Здесь появится история запусков</div>';
      return;
    }
    logEl.innerHTML = list.map(item => `
      <div class="log-row">
        <div class="log-dot ${item.ok ? 'ok' : 'err'}"></div>
        <div class="log-time">${item.time}</div>
        <div class="log-msg">${item.ok ? 'Запущено' : item.message}</div>
      </div>
    `).join('');
  }

  function setState(state, label, detail) {
    btn.className = 'tally state-' + state;
    glow.classList.toggle('on', state === 'running');
    statusLabel.textContent = label;
    statusDetail.textContent = detail;
    lampIcon.innerHTML = state === 'running' ? ICON_PLAY
      : state === 'error' ? ICON_ERROR
      : state === 'ready' && label === 'Запущено' ? ICON_CHECK
      : ICON_PLAY;
  }

  async function runNow() {
    if (WORKER_URL.includes('ВСТАВЬ')) {
      setState('error', 'Не настроено', 'Впиши WORKER_URL и RUNNER_SECRET в код страницы');
      return;
    }

    btn.disabled = true;
    setState('running', 'Запускается…', 'Обращаемся к BMS Poll');

    const time = new Date().toLocaleString('ru-RU', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });
    let entry;

    try {
      const resp = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret: RUNNER_SECRET }),
      });
      const data = await resp.json();

      if (resp.ok && data.ok) {
        entry = { time, ok: true };
        setState('ready', 'Запущено', 'GitHub Actions начал опрос BMS — обновление на доске появится через пару минут');
      } else {
        entry = { time, ok: false, message: data.error || `HTTP ${resp.status}` };
        setState('error', 'Ошибка запуска', entry.message);
      }
    } catch (e) {
      entry = { time, ok: false, message: e.message || 'Сеть недоступна' };
      setState('error', 'Ошибка запуска', entry.message);
    }

    const list = loadHistory();
    list.unshift(entry);
    saveHistory(list);
    renderHistory();
    btn.disabled = false;

    if (entry.ok) {
      setTimeout(() => setState('ready', 'Готов к запуску', 'Обновит доску по текущим данным BMS'), 4000);
    }
  }

  document.getElementById('clearBtn').addEventListener('click', () => {
    localStorage.removeItem(STORAGE_KEY);
    renderHistory();
  });

  btn.addEventListener('click', runNow);

  renderHistory();
</script>
</body>
</html>
